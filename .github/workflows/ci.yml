name: Проверки

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: pip install -r requirements.txt
      - name: Линтинг
        run: python -m ruff check app tests
      - name: Форматирование
        run: python -m ruff format --check app tests
      - name: Тесты
        run: python -m pytest tests -q
      - name: Импорт приложения
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка интерфейса
        run: npm ci && npm test && npm run build

  isolated-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить изолированную конфигурацию проверки
        run: |
          cat > .env <<'ENV'
          ENVIRONMENT=production
          APP_URL=https://invest.example.test
          SECRET_KEY=isolated-ci-only-secret-not-for-use-in-any-deployment-2026
          POSTGRES_PASSWORD=isolated_ci_only_database_password
          INVESTSCAN_DEV_AUTH=false
          ENV
      - name: Собрать и проверить PostgreSQL, миграции и закрытый API
        run: |
          docker compose --env-file .env -f deploy/investscan/compose.yml up -d --build --wait --wait-timeout 180
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8093/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8093/api/v1/investscan/objects)" = 401
          bash scripts/backup-investscan.sh
          bash scripts/restore-check-investscan.sh "$(ls backups/*.dump)"
      - name: Журналы изолированной проверки
        if: failure()
        run: docker compose --env-file .env -f deploy/investscan/compose.yml logs --tail 80
      - name: Удалить только тестовый стек runner
        if: always()
        run: docker compose --env-file .env -f deploy/investscan/compose.yml down -v
