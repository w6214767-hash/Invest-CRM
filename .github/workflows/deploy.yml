name: Деплой на VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Проверка настроек деплоя
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PROJECT_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"
      - name: Обновление приложения на Timeweb VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            git pull --ff-only origin main
            test -f .env || { echo "Файл .env не найден на VPS"; exit 1; }
            docker compose -f deploy/docker-compose.yml build
            docker compose -f deploy/docker-compose.yml up -d db redis
            docker compose -f deploy/docker-compose.yml run --rm backend alembic upgrade head
            docker compose -f deploy/docker-compose.yml up -d
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1/health
            docker image prune -f
