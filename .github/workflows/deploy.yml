name: Подготовка выпуска ИнвестСкан

# A merge must not run the legacy port-80 stack against the existing VPS.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать архив точной ревизии без секретов и данных
        run: |
          mkdir -p release
          git archive --format=tar.gz --output=release/investscan-${GITHUB_SHA}.tar.gz HEAD
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          cp docs/investscan-hq-release.md release/RELEASE.md
          cd release
          sha256sum investscan-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: investscan-${{ github.sha }}
          path: release/
          retention-days: 14
